[project]
name = "churn-app"
version = "0.1.0"
description = "Streamlit app exploring and predicting churn on music-streaming event logs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Guust Goossens" }]
dependencies = [
    "altair>=5.4,<6",
    "pandas>=2.2,<3",
    "pyarrow>=17",
    "scikit-learn>=1.5,<2",
    "streamlit>=1.55,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=churn_app --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
