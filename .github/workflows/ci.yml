name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.9.18"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # --frozen: fail instead of silently re-resolving if uv.lock is stale.
      - run: uv sync --frozen
      - name: Unit and app tests (fails under 90% coverage)
        run: uv run pytest --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  docker:
    needs: [lint, test]
    runs-on: ubuntu-latest
    env:
      # Publishing is opt-in: set the DOCKERHUB_USERNAME repository variable and
      # the DOCKERHUB_TOKEN secret. Without them the image is only built + tested.
      PUBLISH: ${{ vars.DOCKERHUB_USERNAME != '' && github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: churn-explorer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name app -p 8501:8501 churn-explorer:ci
          for attempt in $(seq 1 30); do
            if curl -fs http://localhost:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1

      - name: Image tags
        if: env.PUBLISH == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/churn-explorer
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
